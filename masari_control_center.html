<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساري — مركز التحكم</title><style>:root{--a:#637F91;--b:#455D6C;--y:#FFE69D;--bg:#f7f2e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font-family:Arial,Tahoma,sans-serif}header{background:#fff;padding:22px;text-align:center;border-bottom:3px dashed #86A2B3}main{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border:2px solid #ddd6c8;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:4px 4px 0 #ddd7ca}.grid,.quick,.tabs{display:grid;gap:8px}.grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.quick{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}.tabs{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}.stat{font-size:28px;font-weight:bold;margin-top:5px}button,input,textarea{font:inherit;border-radius:10px}button{border:0;padding:11px;background:var(--a);color:#fff;font-weight:bold}button.red{background:#b75c5c}button.alt{background:var(--y);color:var(--b)}input,textarea{width:100%;padding:11px;border:1px solid #bcc6cb;margin:5px 0}textarea{min-height:120px}table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow:auto}th,td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap;text-align:right}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px}.box{background:#fff;border-radius:18px;padding:18px;width:min(850px,100%);max-height:90vh;overflow:auto}.actions{display:flex;gap:5px}</style></head><body><header><h1>✦ مساري — مركز التحكم ✦</h1><div>إدارة المحتوى وقاعدة البيانات دون تعديل الموقع الأساسي</div></header><main><section id="login" class="card"><h2>تسجيل الدخول</h2><input id="url" placeholder="Supabase URL"><input id="key" placeholder="Anon / Publishable Key"><button onclick="connect()">دخول</button><p id="msg"></p></section><section id="app" style="display:none"><div class="grid"><div class="card">المحتوى<div id="c" class="stat">—</div></div><div class="card">الدروس<div id="l" class="stat">—</div></div><div class="card">الوحدات<div id="u" class="stat">—</div></div><div class="card">الأسئلة<div id="q" class="stat">—</div></div><div class="card">الزيارات/الأحداث<div id="e" class="stat">—</div></div></div><div class="quick"><button onclick="openT('subjects')">📚 المواد</button><button onclick="openT('units')">📖 الوحدات</button><button onclick="openT('lessons')">📝 الدروس</button><button onclick="openT('content_items')">🔗 الروابط والمحتوى</button><button onclick="openT('questions')">❓ الأسئلة</button><button onclick="openT('announcements')">📢 الإعلانات</button><button onclick="openT('tests')">🧪 الاختبارات</button><button onclick="openT('analytics_events')">📊 الإحصائيات</button></div><div id="tabs" class="tabs"></div><section id="panel" class="card"></section></section></main><div id="modal" class="modal"><div class="box"><h2 id="mt">إضافة</h2><div id="mb"></div><div class="actions"><button onclick="save()">حفظ</button><button class="alt" onclick="closeM()">إلغاء</button></div></div></div><script>
const T=[['subjects','المواد'],['units','الوحدات'],['lessons','الدروس'],['content_items','المحتوى والروابط'],['questions','الأسئلة'],['question_options','خيارات الأسئلة'],['tests','الاختبارات'],['test_questions','أسئلة الاختبارات'],['announcements','الإعلانات'],['academic_years','السنوات الدراسية'],['grades','الصفوف'],['tracks','المسارات'],['admin_users','المشرفون'],['analytics_events','الإحصائيات']];let B='',K='',cur='subjects',rows=[],edit=null;const $=x=>document.getElementById(x);function connect(){B=$('url').value.trim().replace(/\/$/,'');K=$('key').value.trim();if(!B||!K){$('msg').textContent='أدخل الرابط والمفتاح.';return}localStorage.setItem('sburl',B);localStorage.setItem('sbkey',K);$('login').style.display='none';$('app').style.display='block';tabs();stats();openT('subjects')}async function api(t,m='GET',q='?select=*',b){let r=await fetch(B+'/rest/v1/'+t+q,{method:m,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation'},body:b===undefined?undefined:JSON.stringify(b)}),x=await r.text(),d;try{d=x?JSON.parse(x):null}catch{d=x}if(!r.ok)throw Error(typeof d==='string'?d:(d?.message||JSON.stringify(d)));return d}async function cnt(t){try{return(await api(t,'GET','?select=id')).length}catch{return 0}}async function stats(){[['c','content_items'],['l','lessons'],['u','units'],['q','questions'],['e','analytics_events']].forEach(async x=>$(x[0]).textContent=await cnt(x[1]))}function tabs(){$('tabs').innerHTML=T.map(x=>`<button onclick="openT('${x[0]}')">${x[1]}</button>`).join('')}function name(t){return T.find(x=>x[0]==t)?.[1]||t}async function openT(t){cur=t;$('panel').innerHTML=`<h2>${name(t)}</h2><input id="search" placeholder="ابحث..." oninput="render()"><div class="actions"><button onclick="add()">＋ إضافة</button><button class="alt" onclick="load()">↻ تحديث</button></div><div id="status">جار التحميل...</div><div id="table"></div>`;await load()}async function load(){try{rows=await api(cur);$('status').textContent=rows.length+' صف';render()}catch(x){$('status').textContent='خطأ: '+x.message}}function render(){let s=($('search')?.value||'').toLowerCase(),d=rows.filter(r=>!s||JSON.stringify(r).toLowerCase().includes(s));if(!d.length){$('table').innerHTML='<p>لا توجد بيانات.</p>';return}let cs=[...new Set(rows.flatMap(r=>Object.keys(r)))].slice(0,7);$('table').innerHTML='<table><tr>'+cs.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>إجراء</th></tr>'+d.map(r=>'<tr>'+cs.map(c=>'<td>'+esc(String(r[c]??'' )).slice(0,100)+'</td>').join('')+`<td><button onclick='ed(${JSON.stringify(r)})'>تعديل</button> <button class="red" onclick="del('${esc(r.id||'')}')">حذف</button></td></tr>`).join('')+'</table>'}function add(){edit=null;let r=rows[0]||{};delete r.id;delete r.created_at;delete r.updated_at;form(r);$('mt').textContent='إضافة — '+name(cur);$('modal').style.display='flex'}function ed(r){edit=r.id||null;form(r);$('mt').textContent='تعديل — '+name(cur);$('modal').style.display='flex'}function form(r){let ks=Object.keys(r).filter(k=>!['id','created_at','updated_at'].includes(k));$('mb').innerHTML=ks.length?ks.map(k=>`<label>${esc(k)}</label><input data-k="${esc(k)}" value="${esc(typeof r[k]=='object'&&r[k]!==null?JSON.stringify(r[k]):r[k]??'')}">`).join(''):'<p>أدخل JSON</p><textarea id="json">{}</textarea>'}async function save(){try{let o={};if($('json'))o=JSON.parse($('json').value);else document.querySelectorAll('[data-k]').forEach(e=>o[e.dataset.k]=e.value);delete o.id;delete o.created_at;delete o.updated_at;if(edit)await api(cur,'PATCH','?id=eq.'+encodeURIComponent(edit),o);else await api(cur,'POST','',o);closeM();await load();stats()}catch(x){alert('لم يتم الحفظ: '+x.message)}}async function del(id){if(!id||!confirm('تأكيد الحذف؟'))return;try{await api(cur,'DELETE','?id=eq.'+encodeURIComponent(id));await load();stats()}catch(x){alert('لم يتم الحذف: '+x.message)}}function closeM(){$('modal').style.display='none'}function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}(function(){B=localStorage.getItem('sburl')||'';K=localStorage.getItem('sbkey')||'';if(B&&K){$('login').style.display='none';$('app').style.display='block';tabs();stats();openT('subjects')}})();</script></body></html>
