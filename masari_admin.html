<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساري — مركز التحكم</title><style>:root{--a:#637F91;--b:#455D6C;--y:#FFE69D;--bg:#f8f3e7}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:var(--b)}header{padding:22px;text-align:center;background:#fff;border-bottom:3px dashed #86A2B3}main{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;padding:18px;margin-bottom:16px;border:2px solid #d9d4c7;border-radius:18px;box-shadow:4px 4px 0 #d9d4c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.stat{font-size:28px;font-weight:bold}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #bcc5c9;font:inherit;margin-top:7px}button{background:var(--a);color:#fff;border:0;cursor:pointer;font-weight:bold}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:15px}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:right}small{color:#68757d}</style></head><body><header><h1>✦ مساري — مركز التحكم ✦</h1><small>إدارة المحتوى بدون تغيير الموقع الأساسي</small></header><main><section id="login" class="card"><h2>تسجيل الدخول</h2><small>أدخل بيانات Supabase لمشروع مساري.</small><input id="url" placeholder="https://xxxxx.supabase.co"><input id="key" placeholder="Anon / Public Key"><button onclick="connect()">دخول</button><p id="msg"></p></section><section id="app" style="display:none"><div class="grid"><div class="card">المحتوى<div id="c1" class="stat">—</div></div><div class="card">الدروس<div id="c2" class="stat">—</div></div><div class="card">الوحدات<div id="c3" class="stat">—</div></div><div class="card">الأسئلة<div id="c4" class="stat">—</div></div></div><div class="tabs"><button onclick="show('content')">المحتوى</button><button onclick="show('lessons')">الدروس</button><button onclick="show('units')">الوحدات</button><button onclick="show('subjects')">المواد</button><button onclick="show('questions')">الأسئلة</button><button onclick="show('stats')">الإحصائيات</button></div><div id="panel" class="card"></div></section></main><script>
let base='',key='';
function connect(){base=document.getElementById('url').value.trim().replace(/\/$/,'');key=document.getElementById('key').value.trim();if(!base||!key){msg.textContent='أدخل البيانات كاملة.';return}localStorage.setItem('masari_sb_url',base);localStorage.setItem('masari_sb_key',key);login.style.display='none';app.style.display='block';loadCounts();show('content')}
async function api(t,m='GET',b=null){let r=await fetch(base+'/rest/v1/'+t+(m==='GET'?'?select=*':''),{method:m,headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:'return=representation'},body:b?JSON.stringify(b):null});if(!r.ok)throw Error(await r.text());return r.json()}
async function count(t){let r=await fetch(base+'/rest/v1/'+t+'?select=id',{headers:{apikey:key,Authorization:'Bearer '+key}});return r.ok?(await r.json()).length:0}
async function loadCounts(){c1.textContent=await count('content_items');c2.textContent=await count('lessons');c3.textContent=await count('units');c4.textContent=await count('questions')}
const map={content:'content_items',lessons:'lessons',units:'units',subjects:'subjects',questions:'questions'};
function show(type){if(type==='stats'){panel.innerHTML='<h2>الإحصائيات</h2><div class="stat" id="vis">…</div><p>الأحداث المسجلة</p>';count('analytics_events').then(x=>vis.textContent=x);return}panel.innerHTML='<h2>'+type+'</h2><input id="search" placeholder="ابحث..."><button onclick="addRow(\''+map[type]+'\')">＋ إضافة</button><div id="list">جارِ التحميل...</div>';loadTable(map[type])}
async function loadTable(t){try{let d=await api(t),q=(search.value||'').toLowerCase();if(q)d=d.filter(x=>JSON.stringify(x).toLowerCase().includes(q));let ks=[...new Set(d.flatMap(x=>Object.keys(x)))].slice(0,6);list.innerHTML='<table><tr>'+ks.map(k=>'<th>'+k+'</th>').join('')+'<th></th></tr>'+d.map(x=>'<tr>'+ks.map(k=>'<td>'+String(x[k]??'').slice(0,100)+'</td>').join('')+'<td><button onclick="delRow(\''+t+'\',\''+x.id+'\')">حذف</button></td></tr>').join('')+'</table>'}catch(e){list.textContent='تعذر التحميل: '+e.message}}
async function delRow(t,id){if(!confirm('تأكيد الحذف؟'))return;let r=await fetch(base+'/rest/v1/'+t+'?id=eq.'+id,{method:'DELETE',headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok)alert(await r.text());showByTable(t)}
function showByTable(t){let type=Object.keys(map).find(k=>map[k]===t)||'content';show(type);loadCounts()}
async function addRow(t){let v=prompt('اكتب الاسم أو العنوان:');if(!v)return;let f=t==='subjects'||t==='units'?'name':t==='questions'?'question':'title';try{await api(t,'POST',{[f]:v});showByTable(t)}catch(e){alert(e.message)}}
(function(){let u=localStorage.getItem('masari_sb_url'),k=localStorage.getItem('masari_sb_key');if(u&&k){base=u;key=k;login.style.display='none';app.style.display='block';loadCounts();show('content')}})();
</script></body></html>
