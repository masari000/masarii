<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مساري — مركز التحكم</title>
<style>
:root{--a:#637F91;--b:#455D6C;--y:#FFE69D;--g:#86A2B3;--bg:#f7f2e7;--line:#ddd6c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--b);font-family:Arial,Tahoma,sans-serif}header{background:#fff;padding:22px 16px;text-align:center;border-bottom:3px dashed var(--g)}h1{margin:0;font-size:30px}.sub{margin-top:8px;color:#71808a}main{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:15px;box-shadow:4px 4px 0 #ddd7ca}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:700;margin-top:5px}button,input,select,textarea{font:inherit;border-radius:10px}button{border:0;padding:11px 14px;background:var(--a);color:white;font-weight:700;cursor:pointer}button.alt{background:var(--y);color:var(--b)}button.red{background:#b75c5c}button.gray{background:#7b858b}input,select,textarea{width:100%;border:1px solid #bcc6cb;padding:11px;background:#fff}textarea{min-height:140px;direction:ltr;text-align:left}.toolbar{display:grid;grid-template-columns:2fr 1fr auto auto;gap:8px}.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:7px;margin-bottom:14px}.tabs button.active{background:var(--b)}table{width:100%;border-collapse:collapse;margin-top:12px;display:block;overflow:auto}th,td{padding:9px;border-bottom:1px solid #e1ddd5;text-align:right;white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}th{background:#f4f0e7}.actions{display:flex;gap:5px}.actions button{padding:7px 9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modalbox{background:white;border-radius:18px;max-width:850px;width:100%;max-height:92vh;overflow:auto;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:700;margin-bottom:3px}.field.full{grid-column:1/-1}.note{font-size:13px;color:#71808a}.err{color:#a33}@media(max-width:700px){.toolbar{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head><body>
<header><h1>✦ مساري — مركز التحكم ✦</h1><div class="sub">إدارة قاعدة البيانات والمحتوى دون تعديل الموقع الأساسي</div></header>
<main><section id="login" class="card"><h2>تسجيل الدخول</h2><p class="note">بيانات الاتصال تحفظ على جهازك فقط.</p><input id="url" placeholder="Supabase URL"><input id="key" placeholder="Anon / Publishable Key" style="margin-top:8px"><button style="margin-top:8px" onclick="connect()">دخول إلى المركز</button><p id="loginMsg"></p></section>
<section id="app" style="display:none"><div class="grid"><div class="card">المحتوى<div id="n_content" class="stat">—</div></div><div class="card">الدروس<div id="n_lessons" class="stat">—</div></div><div class="card">الوحدات<div id="n_units" class="stat">—</div></div><div class="card">الأسئلة<div id="n_questions" class="stat">—</div></div><div class="card">الزيارات/الأحداث<div id="n_events" class="stat">—</div></div></div><div class="tabs" id="tabs"></div><div id="panel" class="card"></div></section></main>
<div id="modal" class="modal"><div class="modalbox"><h2 id="modalTitle">إضافة</h2><div id="modalBody"></div><div style="display:flex;gap:8px;margin-top:14px"><button onclick="saveModal()">حفظ</button><button class="gray" onclick="closeModal()">إلغاء</button></div></div></div>
<script>
const TABLES=[['subjects','المواد'],['units','الوحدات'],['lessons','الدروس'],['content_items','المحتوى والروابط'],['questions','الأسئلة'],['question_options','خيارات الأسئلة'],['tests','الاختبارات'],['test_questions','أسئلة الاختبارات'],['announcements','الإعلانات'],['academic_years','السنوات الدراسية'],['grades','الصفوف'],['tracks','المسارات'],['admin_users','المشرفون'],['analytics_events','الإحصائيات']];let base='',key='',current='subjects',rows=[],columns=[],editingId=null;
const $=id=>document.getElementById(id);function connect(){base=$('url').value.trim().replace(/\/$/,'');key=$('key').value.trim();if(!base||!key){$('loginMsg').textContent='أدخل الرابط والمفتاح.';return}localStorage.setItem('masari_sb_url',base);localStorage.setItem('masari_sb_key',key);$('login').style.display='none';$('app').style.display='block';buildTabs();refreshAll();openTable('subjects')}
async function req(t,m='GET',q='?select=*',b=null){let r=await fetch(base+'/rest/v1/'+t+q,{method:m,headers:{apikey:key,Authorization:'Bearer '+key,'Content-Type':'application/json',Prefer:'return=representation'},body:b===null?null:JSON.stringify(b)});let s=await r.text(),d;try{d=s?JSON.parse(s):null}catch{d=s}if(!r.ok)throw Error(typeof d==='string'?d:(d?.message||JSON.stringify(d)));return d}async function count(t){try{return(await req(t)).length}catch{return 0}}
function buildTabs(){$('tabs').innerHTML=TABLES.map(([t,n])=>`<button id="tab_${t}" onclick="openTable('${t}')">${n}</button>`).join('')}async function refreshAll(){for(const [id,t] of [['n_content','content_items'],['n_lessons','lessons'],['n_units','units'],['n_questions','questions'],['n_events','analytics_events']])$(id).textContent=await count(t)}function label(t){return TABLES.find(x=>x[0]===t)?.[1]||t}
async function openTable(t){current=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));$('tab_'+t)?.classList.add('active');$('panel').innerHTML=`<h2>${label(t)}</h2><div class="toolbar"><input id="search" placeholder="بحث في البيانات..." oninput="renderRows()"><select id="limit" onchange="loadRows()"><option value="50">50 صف</option><option value="100">100 صف</option><option value="250">250 صف</option></select><button onclick="newRow()">＋ إضافة</button><button class="alt" onclick="loadRows()">↻ تحديث</button></div><div id="status" class="note" style="margin-top:8px">جارِ التحميل...</div><div id="tableWrap"></div>`;await loadRows()}
async function loadRows(){try{let lim=$('limit')?.value||50;rows=await req(current,'GET',`?select=*&limit=${lim}`);columns=[...new Set(rows.flatMap(r=>Object.keys(r)))];$('status').textContent=rows.length?`${rows.length} صف`:'لا توجد بيانات في هذا الجدول.';renderRows()}catch(e){$('status').innerHTML='<span class="err">خطأ: '+esc(e.message)+'</span>';$('tableWrap').innerHTML=''}}
function renderRows(){let q=($('search')?.value||'').toLowerCase(),data=rows.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));if(!data.length){$('tableWrap').innerHTML='<p class="note">لا توجد نتائج.</p>';return}let cols=columns.slice(0,7);$('tableWrap').innerHTML='<table><thead><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'<th>إجراء</th></tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>`<td title="${esc(String(r[c]??''))}">${esc(String(r[c]??'')).slice(0,100)}</td>`).join('')+`<td><div class="actions"><button onclick='editRow(${JSON.stringify(r)})'>تعديل</button><button class="red" onclick="deleteRow('${esc(String(r.id||''))}')">حذف</button></div></td></tr>`).join('')+'</tbody></table>'}
function newRow(){editingId=null;$('modalTitle').textContent='إضافة — '+label(current);if(rows.length){let r={...rows[0]};delete r.id;delete r.created_at;delete r.updated_at;buildFields(r)}else $('modalBody').innerHTML='<p class="note">الجدول فارغ. أدخل JSON صالحًا حسب أعمدة الجدول.</p><textarea id="jsonBox">{}</textarea>';$('modal').style.display='flex'}function editRow(r){editingId=r.id||null;$('modalTitle').textContent='تعديل — '+label(current);buildFields(r);$('modal').style.display='flex'}
function buildFields(r){let ks=Object.keys(r).filter(k=>!['id','created_at','updated_at'].includes(k));if(!ks.length){$('modalBody').innerHTML='<textarea id="jsonBox">'+esc(JSON.stringify(r,null,2))+'</textarea>';return}$('modalBody').innerHTML='<div class="fields">'+ks.map(k=>{let v=r[k],full=String(v??'').length>120||/description|content|body|text|url|link|question|answer/i.test(k);return `<div class="field ${full?'full':''}"><label>${esc(k)}</label><input data-field="${esc(k)}" value="${esc(typeof v==='object'&&v!==null?JSON.stringify(v):v??'')}"></div>`}).join('')+'</div><p class="note">الحقول id والتواريخ لا تحتاج تعديلًا.</p>'}
async function saveModal(){try{let obj={};if($('jsonBox')){obj=JSON.parse($('jsonBox').value);delete obj.id}else document.querySelectorAll('#modalBody [data-field]').forEach(el=>{let k=el.dataset.field,v=el.value;if(v==='null')v=null;else if((v.startsWith('{')&&v.endsWith('}'))||(v.startsWith('[')&&v.endsWith(']'))){try{v=JSON.parse(v)}catch{}}obj[k]=v});if(editingId)await req(current,'PATCH','?id=eq.'+encodeURIComponent(editingId),obj);else await req(current,'POST','',obj);closeModal();await loadRows();await refreshAll()}catch(e){alert('لم يتم الحفظ:\n'+e.message)}}async function deleteRow(id){if(!id){alert('هذا الصف لا يحتوي id واضح.');return}if(!confirm('تأكيد حذف هذا السجل؟'))return;try{await req(current,'DELETE','?id=eq.'+encodeURIComponent(id));await loadRows();await refreshAll()}catch(e){alert('لم يتم الحذف:\n'+e.message)}}function closeModal(){$('modal').style.display='none'}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
(function(){let u=localStorage.getItem('masari_sb_url'),k=localStorage.getItem('masari_sb_key');if(u&&k){base=u;key=k;$('login').style.display='none';$('app').style.display='block';buildTabs();refreshAll();openTable('subjects')}})();
</script></body></html>
