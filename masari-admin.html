<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مساري — لوحة التحكم</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f7f2e8;color:#263842;margin:0}.top{padding:16px;background:#455d6c;color:#fff;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fffdf7;border:1px solid #d8d0bf;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}input,textarea,select{padding:10px;border:1px solid #cfc6b4;border-radius:10px}textarea{min-height:100px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#455d6c;color:#fff}.yellow{background:#ffe69d}.red{background:#b65d63;color:#fff}.tabs{display:flex;gap:7px;overflow:auto}.tab{white-space:nowrap;background:#e9e3d6}.tab.active{background:#637f91;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:10px;border-radius:10px;background:#edf4f1;margin:8px 0}.err{background:#fae5e5;color:#7b3036}.hidden{display:none}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:8px;border-bottom:1px solid #e3dccd;text-align:right;font-size:13px}th{background:#eee8dc}.login{max-width:420px;margin:12vh auto}.muted{color:#718087;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div id="login" class="wrap login"><div class="card"><h2>مساري — لوحة التحكم</h2><p class="muted">للحساب الإداري فقط</p><div id="lm"></div><div class="field"><label>البريد</label><input id="email" type="email"></div><br><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><br><button class="primary" onclick="login()">دخول</button></div></div><div id="app" class="hidden"><div class="top"><b>مساري — لوحة التحكم</b><button onclick="logout()">خروج</button></div><main class="wrap"><div id="m"></div><div class="card"><div class="tabs" id="tabs"></div></div><div class="card"><div class="row" style="justify-content:space-between"><h3 id="title">المواد</h3><button class="yellow" onclick="newRow()">+ إضافة</button></div><form id="form" class="grid"></form><div class="row" style="margin-top:10px"><button class="primary" onclick="save(event)">حفظ</button><button type="button" onclick="cancelEdit()">إلغاء</button></div></div><div class="card"><div class="row" style="justify-content:space-between"><h3>السجلات</h3><button onclick="load()">تحديث</button></div><div id="list" class="table"></div></div></main></div><script>
const URL='https://xsoreadsioxxpbsrygaq.supabase.co',KEY='sb_publishable_pCbks8kySoi3_QxcsqANow_Rrw775Ah',db=supabase.createClient(URL,KEY);
const tables={subjects:{label:'المواد',fields:[['name','اسم المادة','text'],['slug','المعرّف','text'],['description','الوصف','textarea'],['is_active','نشطة','bool']]},units:{label:'الوحدات',fields:[['subject_id','المادة','fk:subjects'],['name','اسم الوحدة','text'],['description','الوصف','textarea'],['sort_order','الترتيب','number'],['is_active','نشطة','bool']]},lessons:{label:'الدروس',fields:[['unit_id','الوحدة','fk:units'],['name','اسم الدرس','text'],['description','الوصف','textarea'],['sort_order','الترتيب','number'],['is_active','نشطة','bool']]},content_items:{label:'المصادر والروابط',fields:[['lesson_id','الدرس','fk:lessons'],['title','العنوان','text'],['content_type','نوع المحتوى','text'],['url','الرابط','text'],['description','الوصف','textarea'],['sort_order','الترتيب','number'],['is_active','نشط','bool'],['is_published','منشور','bool']]},questions:{label:'الأسئلة',fields:[['lesson_id','الدرس','fk:lessons'],['question','السؤال','textarea'],['explanation','الشرح','textarea'],['is_active','نشط','bool']]},tests:{label:'الاختبارات',fields:[['subject_id','المادة','fk:subjects'],['title','العنوان','text'],['description','الوصف','textarea'],['is_published','منشور','bool']]},announcements:{label:'الأخبار والتحديثات',fields:[['title','العنوان','text'],['content','المحتوى','textarea'],['is_published','منشور','bool'],['published_at','تاريخ النشر','text']]},academic_years:{label:'السنوات الدراسية',fields:[['name','الاسم','text'],['is_active','نشطة','bool']]},grades:{label:'الصفوف',fields:[['name','الاسم','text'],['is_active','نشطة','bool']]},tracks:{label:'المسارات',fields:[['grade_id','الصف','fk:grades'],['name','الاسم','text'],['is_active','نشط','bool']]}};
let current='subjects',edit=null,cache={};
const $=x=>document.getElementById(x); const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(t,e=false){$('m').innerHTML=t?`<div class="msg ${e?'err':''}">${esc(t)}</div>`:''}function loginMsg(t,e=false){$('lm').innerHTML=t?`<div class="msg ${e?'err':''}">${esc(t)}</div>`:''}
async function login(){loginMsg('');let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(error)loginMsg(error.message,true)}async function logout(){await db.auth.signOut()}
async function start(){let {data:{session}}=await db.auth.getSession();if(session){$('login').classList.add('hidden');$('app').classList.remove('hidden');tabs();form();load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
db.auth.onAuthStateChange(()=>start());
function tabs(){$('tabs').innerHTML=Object.entries(tables).map(([k,v])=>`<button class="tab ${k===current?'active':''}" onclick="current='${k}';edit=null;tabs();form();load()">${v.label}</button>`).join('')}
async function options(table){if(cache[table])return cache[table];let {data}=await db.from(table).select('id,name,title').limit(300);cache[table]=data||[];return cache[table]}
async function form(){let t=tables[current];$('title').textContent=t.label+ (edit?' — تعديل':'');let h='';for(let [k,l,type] of t.fields){let v=edit?.[k];if(type==='textarea')h+=`<div class="field full"><label>${l}</label><textarea name="${k}">${esc(v??'')}</textarea></div>`;else if(type==='bool')h+=`<div class="field"><label>${l}</label><select name="${k}"><option value="true" ${v!==false?'selected':''}>نعم</option><option value="false" ${v===false?'selected':''}>لا</option></select></div>`;else if(type.startsWith('fk:')){let target=type.slice(3),os=await options(target);h+=`<div class="field"><label>${l}</label><select name="${k}"><option value="">—</option>${os.map(o=>`<option value="${esc(o.id)}" ${String(v)===String(o.id)?'selected':''}>${esc(o.name||o.title||o.id)}</option>`).join('')}</select></div>`}else h+=`<div class="field"><label>${l}</label><input name="${k}" type="${type==='number'?'number':'text'}" value="${esc(v??'')}"></div>`}$('form').innerHTML=h}
async function load(){let {data,error}=await db.from(current).select('*').order('created_at',{ascending:false}).limit(100);if(error){$('list').innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}cache.rows=data||[];if(!data.length){$('list').innerHTML='<p class="muted">لا توجد سجلات.</p>';return}let keys=Object.keys(data[0]).filter(k=>!['created_at','updated_at'].includes(k)).slice(0,7);let h='<table><tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'<th>إجراء</th></tr>';for(let r of data)h+='<tr>'+keys.map(k=>`<td>${esc(String(r[k]??'').slice(0,90))}</td>`).join('')+`<td><button onclick='editRow(${JSON.stringify(r).replace(/</g,'\\u003c')})'>تعديل</button> <button class="red" onclick="del('${esc(r.id)}')">حذف</button></td></tr>`;$('list').innerHTML=h+'</table>'}
function editRow(r){edit=r;form();scrollTo({top:0,behavior:'smooth'})}function newRow(){edit=null;form();scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){edit=null;form()}
async function save(e){e.preventDefault();let obj={};for(let [k,v] of new FormData($('form'))){if(v==='')continue;let f=tables[current].fields.find(x=>x[0]===k);obj[k]=f?.[2]==='bool'?v==='true':f?.[2]==='number'?Number(v):v}let q=edit?db.from(current).update(obj).eq('id',edit.id):db.from(current).insert(obj);let {error}=await q;if(error)message(error.message,true);else{message(edit?'تم التعديل بنجاح.':'تمت الإضافة بنجاح.');edit=null;cache={};form();load()}}
start();
</script></body></html>
