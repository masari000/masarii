<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم مساري</title>
<style>
:root{--a:#637F91;--b:#455D6C;--y:#FFE69D;--p:#86A2B3;--g:#f6f1df;--w:#fff;--line:#d9dfe2}
*{box-sizing:border-box}body{margin:0;background:#f5f0df;color:#26343c;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
header{background:var(--b);color:#fff;padding:18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 14px #0002}header h1{margin:0;font-size:24px}header small{opacity:.85}
.wrap{display:flex;min-height:calc(100vh - 78px)}aside{width:245px;background:#fff;border-left:1px solid var(--line);padding:14px;position:sticky;top:78px;height:calc(100vh - 78px);overflow:auto}main{flex:1;padding:20px;max-width:1250px}
nav button{width:100%;border:0;background:transparent;text-align:right;padding:13px;border-radius:13px;font-size:15px;cursor:pointer;margin:3px 0}nav button:hover,nav button.active{background:#eef4f6;color:var(--b);font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 4px 15px #455d6c12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{font-weight:750;font-size:14px;display:block}input,select,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #cfd7db;border-radius:12px;background:#fff;font:inherit}textarea{min-height:120px;resize:vertical}
button.primary{background:var(--b);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.muted{color:#687780}.stat{background:#fff9e7;border:2px dashed #b9a96f;border-radius:18px;padding:16px}.num{font-size:28px;font-weight:900;color:var(--b)}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:right}th{background:#f4f7f8}.ok{color:#18794e;font-weight:800}.err{color:#b42318;font-weight:800}
@media(max-width:800px){.wrap{display:block}aside{width:100%;height:auto;position:static;border-left:0;border-bottom:1px solid var(--line)}.grid,.grid3{grid-template-columns:1fr}main{padding:12px}nav{display:grid;grid-template-columns:1fr 1fr}.card{border-radius:16px}}
</style></head>
<body>
<header><h1>لوحة تحكم مساري</h1><small>إضافة محتوى + متابعة المشاهدين — بدون حذف أو تعديل</small></header>
<div class="wrap"><aside><nav id="nav">
<button data-page="home">🏠 الرئيسية</button><button data-page="stats">📊 الإحصائيات</button><button data-page="subjects">📚 المواد والوحدات</button><button data-page="lessons">📖 الدروس</button><button data-page="questions">📝 الأسئلة والاختبارات</button><button data-page="links">🔗 الروابط</button><button data-page="videos">🎬 الفيديوهات</button><button data-page="files">📁 الملفات وPDF</button><button data-page="images">🖼️ الصور</button><button data-page="news">📰 أخبار الشهادة</button><button data-page="tips">💡 النصائح</button><button data-page="updates">📢 آخر التحديثات</button><button data-page="settings">⚙️ إعدادات الموقع</button>
</nav></aside><main id="app"></main></div>
<script>
const SB="https://xsoreadsioxxpbsrygaq.supabase.co",KEY="sb_publishable_pCbks8kySoi3_QxcsqANow_Rrw775Ah";
const types={subjects:"مواد/وحدات",lessons:"درس",questions:"سؤال/اختبار",links:"رابط",videos:"فيديو/قائمة تشغيل",files:"ملف/PDF",images:"صورة",news:"خبر الشهادة",tips:"نصيحة",updates:"آخر تحديث",settings:"إعداد موقع"};
const labels={subjects:"المواد والوحدات",lessons:"الدروس",questions:"الأسئلة والاختبارات",links:"الروابط",videos:"الفيديوهات",files:"الملفات وPDF",images:"الصور",news:"أخبار الشهادة",tips:"النصائح",updates:"آخر التحديثات",settings:"إعدادات الموقع"};
const routes={home:"الرئيسية",tracks:"المسارات",subjects:"صفحة المواد",track:"داخل المسار",subject:"داخل المادة",lesson:"داخل الدرس",quizzes:"الاختبارات",exams:"السنوات السابقة",resources:"المصادر",timer:"المؤقت",favorites:"المفضلة",progress:"التقدم",settings:"الإعدادات",about:"عن المنصة",news:"أخبار الشهادة",tips:"النصائح",updates:"آخر التحديثات",search:"نتائج البحث",all:"كل الموقع"};
const $=x=>document.querySelector(x), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(path,opts={}){let r=await fetch(SB+"/rest/v1/"+path,{...opts,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",...(opts.headers||{})}});if(!r.ok)throw Error(await r.text());let t=await r.text();return t?JSON.parse(t):null}
function shell(title,body){$("#app").innerHTML=`<h2>${title}</h2>${body}`}
function form(type){return `<div class="card"><h3>➕ إضافة ${labels[type]}</h3><div class="grid">
<label>العنوان / الاسم<input id="title" placeholder="مثال: مراجعة الوحدة الأولى"></label>
<label>مكان ظهور الإضافة<select id="route">${Object.entries(routes).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
<label>معرّف المادة (اختياري)<input id="subject" placeholder="مثال: physics"></label>
<label>معرّف الوحدة (اختياري)<input id="unit" placeholder="مثال: u1_1"></label>
<label>معرّف الدرس (اختياري)<input id="lesson" placeholder="مثال: l1_1_1"></label>
<label>الرابط (اختياري)<input id="url" type="url" placeholder="https://..."></label>
</div><label style="margin-top:14px">المحتوى / الوصف<textarea id="content" placeholder="اكتب النص أو التفاصيل التي تريد إضافتها..."></textarea></label>
<div style="margin-top:14px"><button class="primary" onclick="add('${type}')">إضافة إلى مساري</button> <span id="msg" class="muted"></span></div></div>`}
async function add(type){const msg=$("#msg");msg.textContent="جاري الحفظ...";try{await api("masari_additions",{method:"POST",body:JSON.stringify({kind:type,title:$("#title").value,content:$("#content").value,url:$("#url").value||null,route:$("#route").value,subject_id:$("#subject").value||null,unit_id:$("#unit").value||null,lesson_id:$("#lesson").value||null,enabled:true})});msg.innerHTML='<span class="ok">تمت الإضافة بنجاح ✓</span>';$("#title").value=$("#content").value=$("#url").value=$("#subject").value=$("#unit").value=$("#lesson").value=""}catch(e){msg.innerHTML='<span class="err">تعذر الحفظ. نفّذ setup.sql مرة واحدة في Supabase.</span>'}}
async function stats(){let views=[];let adds=[];try{views=await api("masari_views?select=id,visitor_id,page,created_at&order=created_at.desc&limit=5000")}catch(e){}try{adds=await api("masari_additions?select=id,kind,title,created_at&order=created_at.desc&limit=500")}catch(e){}
const uniq=new Set(views.map(v=>v.visitor_id)).size;const today=new Date().toISOString().slice(0,10);const td=views.filter(v=>String(v.created_at).slice(0,10)===today).length;
shell("📊 الإحصائيات",`<div class="grid3"><div class="stat"><div>إجمالي المشاهدات</div><div class="num">${views.length}</div></div><div class="stat"><div>مشاهدون مميزون</div><div class="num">${uniq}</div></div><div class="stat"><div>مشاهدات اليوم</div><div class="num">${td}</div></div></div><div class="card"><h3>👁️ سجل المشاهدين</h3><table><tr><th>الوقت</th><th>المشاهد</th><th>الصفحة</th></tr>${views.slice(0,100).map(v=>`<tr><td>${esc(new Date(v.created_at).toLocaleString("ar-LY"))}</td><td>${esc(v.visitor_id)}</td><td>${esc(v.page)}</td></tr>`).join("")}</table></div><div class="card"><h3>آخر الإضافات</h3>${adds.slice(0,30).map(a=>`<div style="padding:9px;border-bottom:1px solid #eee"><b>${esc(a.title)}</b> — ${esc(labels[a.kind]||a.kind)} <span class="muted">${new Date(a.created_at).toLocaleString("ar-LY")}</span></div>`).join("")}</div>`)}
function home(){shell("🏠 الرئيسية",`<div class="card"><h3>لوحة الإضافة السريعة</h3><p>اختر نوع المحتوى ثم حدّد مكان ظهوره. كل إضافة جديدة تذهب إلى مساري مباشرة، بدون حذف أو تعديل أي محتوى قديم.</p><p class="muted">للإضافة داخل مادة/وحدة/درس: اختر مكان الظهور المناسب ثم اكتب المعرّفات إذا كانت متوفرة.</p><div class="grid3">${Object.entries(labels).filter(([k])=>k!=="settings").map(([k,v])=>`<button class="primary" onclick="go('${k}')">➕ ${v}</button>`).join("")}</div></div><div class="card"><b>مهم:</b> سجل المشاهدين يسجل الزيارات بشكل مجهول، بدون اسم أو بريد إلكتروني.</div>`)}
function page(p){if(p==="home")return home();if(p==="stats")return stats();if(p==="settings")return shell("⚙️ إعدادات الموقع",`<div class="card"><h3>إضافة إعداد</h3><p class="muted">تُحفظ الإعدادات كإضافات باسم المفتاح الذي تكتبه، بدون حذف الإعدادات الحالية.</p>${form("settings")}</div>`);return shell((labels[p]||p),form(p))}
function go(p){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));location.hash="#"+p;page(p)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));go(location.hash.slice(1)||"home");
</script></body></html>
